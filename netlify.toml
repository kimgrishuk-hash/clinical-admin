[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/session"
  status = 200

[[redirects]]
  from = "/api/clinic"
  to = "/.netlify/functions/clinic"
  status = 200

[[redirects]]
  from = "/api/tasks"
  to = "/.netlify/functions/tasks"
  status = 200

[[redirects]]
  from = "/api/ops"
  to = "/.netlify/functions/ops"
  status = 200

[[redirects]]
  from = "/api/assistant"
  to = "/.netlify/functions/assistant"
  status = 200

[[redirects]]
  from = "/api/files"
  to = "/.netlify/functions/files"
  status = 200

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
