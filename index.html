<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מערכת המרפאה</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}button,input,select,textarea{font:inherit}.wrap{max-width:1200px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e3e8f0;border-radius:14px;padding:14px;box-shadow:0 3px 12px #00000008}.login{max-width:420px;margin:12vh auto}.hidden{display:none!important}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-size:28px;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab,.subtab,.chip{border:0;border-radius:12px;padding:9px 13px;background:#e9eef8;cursor:pointer;font-weight:700}.tab.active,.subtab.active,.chip.active,.primary{background:#356fe8;color:#fff}.search{width:100%;padding:12px 13px;border:1px solid #d8deea;border-radius:13px;background:#fff}.global{margin:10px 0}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;align-items:start}.product{min-width:0;overflow:hidden;padding:0!important;display:flex;flex-direction:column;border-radius:12px}.pic{width:100%;height:92px;min-height:92px;flex:0 0 92px;display:flex;align-items:center;justify-content:center;background:#fbfcff;border-bottom:1px solid #edf0f5;overflow:hidden;position:relative;font-size:26px}.pic img{display:block!important;position:static!important;float:none!important;width:auto!important;height:auto!important;max-width:100%!important;max-height:100%!important;object-fit:contain!important;object-position:center!important;margin:0 auto!important}.product-info{position:relative;z-index:2;background:#fff;padding:8px 9px 9px;min-width:0;overflow:hidden}.product h3{font-size:14px;margin:0 0 4px;line-height:1.25;overflow-wrap:anywhere;word-break:break-word;white-space:normal}.product .muted{font-size:11px}.product .price{font-size:14px;margin:5px 0}.product .btn{font-size:11px;padding:6px 8px}.price{font-size:20px;font-weight:800;color:#2866e6;margin:8px 0}.muted{color:#687386}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sectionbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:8px 0}.form{margin:12px 0}.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid #d8deea;border-radius:10px;margin:5px 0}.form textarea{min-height:80px}.btn{border:0;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700}.danger{background:#ffe7e9;color:#a91e2d}.pricegroup{margin:15px 0}.pricegroup h3{margin:0 0 8px}.price-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:center;padding:10px;border-top:1px solid #edf0f5}.member{color:#16845b;font-weight:800}.results{position:relative}.global-results{position:absolute;z-index:20;top:100%;right:0;left:0;background:#fff;border:1px solid #dce2ec;border-radius:13px;box-shadow:0 10px 30px #0002;max-height:380px;overflow:auto}.result{padding:11px;border-bottom:1px solid #edf0f5;cursor:pointer}.result:hover{background:#f5f8ff}.catfilter{min-width:190px;padding:11px;border:1px solid #d8deea;border-radius:11px;background:#fff}@media(max-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.price-row{grid-template-columns:1fr 1fr}.price-row .name{grid-column:1/-1}}@media(max-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.wrap{padding:9px}.brand{font-size:22px}.pic{height:78px;min-height:78px;flex-basis:78px}.product-info{padding:7px}.product h3{font-size:12px}.product .muted{font-size:10px}.product .price{font-size:12px}.product .btn{font-size:10px;padding:5px 6px}.price-row{grid-template-columns:1fr 1fr}.catfilter{min-width:140px}}
</style>
</head>
<body>
<div class="wrap">
<section id="login" class="card login"><h1>🐾 מערכת המרפאה</h1><p class="muted">גישה לצוות בלבד</p><input id="pin" class="search" type="password" inputmode="numeric" maxlength="4" placeholder="קוד כניסה"><div id="loginErr" style="color:#bd2434;min-height:24px"></div><button class="btn primary" onclick="login()">כניסה</button></section>
<section id="app" class="hidden"><div class="top"><div class="brand">🐾 מערכת המרפאה</div><button class="btn" onclick="logout()">יציאה</button></div><div class="results global"><input id="globalSearch" class="search" placeholder="🔎 חיפוש בכל האתר: מוצר, פרוצדורה, קטגוריה..." oninput="renderGlobal()"><div id="globalResults" class="global-results hidden"></div></div><div class="tabs"><button class="tab active" data-tab="inventory" onclick="showTab('inventory',this)">מלאי</button><button class="tab" data-tab="protocols" onclick="showTab('protocols',this)">פרוטוקולים</button><button class="tab" data-tab="prices" onclick="showTab('prices',this)">מחירון</button></div>
<section id="inventory" class="panel"><div class="sectionbar"><h2>מלאי</h2><button class="btn primary" onclick="openProduct()">+ מוצר חדש</button></div><div class="row"><input id="inventorySearch" class="search" style="flex:1" placeholder="חיפוש במלאי..." oninput="renderInventory()"><select id="inventoryCategory" class="catfilter" onchange="renderInventory()"><option value="">כל הקטגוריות</option></select></div><div id="productForm" class="card form hidden"><h3>עריכת מוצר</h3><input id="prodId" type="hidden"><input id="prodName" placeholder="שם מוצר"><input id="prodCat" placeholder="קטגוריה"><input id="prodPrice" type="number" step="0.01" placeholder="מחיר"><textarea id="prodDetails" placeholder="הערות"></textarea><label>תמונה</label><input id="prodImage" type="file" accept="image/*" onchange="readProductImage(event)"><div class="row"><button class="btn primary" onclick="saveProduct()">שמור</button><button class="btn" onclick="closeProduct()">ביטול</button><button id="prodDelete" class="btn danger" onclick="deleteProduct()">מחיקה</button></div></div><div id="inventoryGrid" class="grid"></div></section>
<section id="protocols" class="panel hidden"><div class="card"><h2>פרוטוקולים</h2><input class="search" placeholder="חיפוש בפרוטוקולים..." disabled><p class="muted">כאן נכניס בהמשך את פרוטוקולי המרפאה ונאפשר חיפוש ועריכה.</p></div></section>
<section id="prices" class="panel hidden"><div class="sectionbar"><h2>מחירון</h2></div><div class="tabs"><button class="subtab active" id="procBtn" onclick="showPriceMode('procedures')">פרוצדורות</button><button class="subtab" id="productsBtn" onclick="showPriceMode('products')">מוצרים</button></div><div id="procedureTools" class="row"><input id="priceSearch" class="search" style="flex:1" placeholder="חיפוש בפרוצדורות..." oninput="renderPrices()"><select id="priceCategory" class="catfilter" onchange="renderPrices()"><option value="">כל הקטגוריות</option></select><button class="btn primary" onclick="openPrice()">+ פרוצדורה חדשה</button></div><div id="priceForm" class="card form hidden"><h3>עריכת מחירון</h3><input id="priceId" type="hidden"><input id="priceName" placeholder="שם"><input id="priceCat" placeholder="קטגוריה"><input id="priceMin" type="number" step="0.01" placeholder="מחיר רגיל / מינימום"><input id="priceMax" type="number" step="0.01" placeholder="מחיר מקסימום (רק אם יש טווח)"><input id="priceDiscount" type="number" value="20" placeholder="אחוז הנחת מנוי"><textarea id="priceNote" placeholder="הערה"></textarea><div class="row"><button class="btn primary" onclick="savePrice()">שמור</button><button class="btn" onclick="closePrice()">ביטול</button><button id="priceDelete" class="btn danger" onclick="deletePrice()">מחיקה</button></div></div><div id="procedurePriceList"></div><div id="productPriceList" class="grid hidden"></div></section></section></div>
<script>
const API='https://bhvkhxmexyhsjhwjsytp.supabase.co/functions/v1/clinic-api';const PIN='1016';let products=[],prices=[],productImageData='',priceMode='procedures';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(body){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-clinic-pin':PIN},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||'שגיאה');return j}function login(){if($('pin').value!==PIN){$('loginErr').textContent='קוד לא נכון';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');sessionStorage.setItem('clinic','1');loadAll()}function logout(){sessionStorage.removeItem('clinic');location.reload()}async function loadAll(){try{const[a,b]=await Promise.all([api({action:'list'}),api({action:'price_list'})]);products=a.items||[];prices=b.items||[];fillFilters();renderInventory();renderPrices();renderProductPrices()}catch(e){alert('שגיאה בטעינת הנתונים: '+e.message)}}function fillFilters(){const pc=[...new Set(products.map(x=>x.category).filter(Boolean))].sort();$('inventoryCategory').innerHTML='<option value="">כל הקטגוריות</option>'+pc.map(c=>`<option>${esc(c)}</option>`).join('');const rc=[...new Set(prices.map(x=>x.category).filter(Boolean))].sort();$('priceCategory').innerHTML='<option value="">כל הקטגוריות</option>'+rc.map(c=>`<option>${esc(c)}</option>`).join('')}function showTab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');$('globalResults').classList.add('hidden')}function renderGlobal(){const q=$('globalSearch').value.trim().toLowerCase(),box=$('globalResults');if(!q){box.classList.add('hidden');box.innerHTML='';return}let out=[];products.filter(x=>(x.name+' '+(x.category||'')+' '+(x.details||'')).toLowerCase().includes(q)).slice(0,8).forEach(x=>out.push(`<div class="result" onclick="jumpProduct(${x.id})"><b>מוצר:</b> ${esc(x.name)} <span class="muted">${esc(x.category||'')}</span></div>`));prices.filter(x=>(x.name+' '+(x.category||'')+' '+(x.note||'')).toLowerCase().includes(q)).slice(0,12).forEach(x=>out.push(`<div class="result" onclick="jumpPrice(${x.id})"><b>מחירון:</b> ${esc(x.name)} <span class="muted">${esc(x.category||'')}</span></div>`));box.innerHTML=out.length?out.join(''):'<div class="result muted">לא נמצאו תוצאות</div>';box.classList.remove('hidden')}function jumpProduct(id){showTab('inventory',document.querySelector('[data-tab="inventory"]'));$('inventorySearch').value=products.find(x=>x.id===id)?.name||'';renderInventory();$('globalSearch').value='';$('globalResults').classList.add('hidden')}function jumpPrice(id){showTab('prices',document.querySelector('[data-tab="prices"]'));showPriceMode('procedures');$('priceSearch').value=prices.find(x=>x.id===id)?.name||'';renderPrices();$('globalSearch').value='';$('globalResults').classList.add('hidden')}function productCard(x,editable){return `<article class="card product"><div class="pic">${x.image_url?`<img src="${x.image_url}" alt="${esc(x.name)}">`:'📦'}</div><div class="product-info"><h3>${esc(x.name)}</h3><div class="muted">${esc(x.category||'')}</div><div class="price">${x.price_ils!=null?x.price_ils+' ₪':'ללא מחיר'}</div>${editable?`<button class="btn" onclick="openProduct(${x.id})">עריכה</button>`:''}</div></article>`}function renderInventory(){const q=$('inventorySearch').value.trim().toLowerCase(),cat=$('inventoryCategory').value;const arr=products.filter(x=>(!cat||x.category===cat)&&(!q||(x.name+' '+(x.category||'')+' '+(x.details||'')).toLowerCase().includes(q)));$('inventoryGrid').innerHTML=arr.map(x=>productCard(x,true)).join('')||'<p class="muted">אין תוצאות</p>'}function openProduct(id){const x=products.find(y=>y.id===id);$('prodId').value=x?.id||'';$('prodName').value=x?.name||'';$('prodCat').value=x?.category||'';$('prodPrice').value=x?.price_ils??'';$('prodDetails').value=x?.details||'';productImageData=x?.image_url||'';$('prodDelete').classList.toggle('hidden',!x);$('productForm').classList.remove('hidden');$('productForm').scrollIntoView({behavior:'smooth'})}function closeProduct(){$('productForm').classList.add('hidden')}function readProductImage(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>productImageData=String(r.result);r.readAsDataURL(f)}async function saveProduct(){const id=$('prodId').value,item={name:$('prodName').value.trim(),category:$('prodCat').value.trim()||'אחר',price_ils:$('prodPrice').value,details:$('prodDetails').value,image_url:productImageData||null};if(!item.name)return alert('צריך שם מוצר');await api({action:id?'update':'create',id,item});closeProduct();await loadAll()}async function deleteProduct(){const id=$('prodId').value;if(id&&confirm('למחוק את המוצר?')){await api({action:'delete',id});closeProduct();await loadAll()}}function showPriceMode(mode){priceMode=mode;$('procBtn').classList.toggle('active',mode==='procedures');$('productsBtn').classList.toggle('active',mode==='products');$('procedureTools').classList.toggle('hidden',mode!=='procedures');$('procedurePriceList').classList.toggle('hidden',mode!=='procedures');$('productPriceList').classList.toggle('hidden',mode!=='products');$('priceForm').classList.add('hidden');if(mode==='products')renderProductPrices()}function money(v){return Number(v).toLocaleString('he-IL',{maximumFractionDigits:2})+' ₪'}function range(a,b){return b!=null&&Number(b)!==Number(a)?money(a)+'–'+money(b):money(a)}function memberRange(x){const d=(100-Number(x.discount_percent??20))/100;return x.regular_price_max!=null&&Number(x.regular_price_max)!==Number(x.regular_price_min)?range(Number(x.regular_price_min)*d,Number(x.regular_price_max)*d):money(Number(x.regular_price_min)*d)}function renderPrices(){const q=$('priceSearch').value.trim().toLowerCase(),cat=$('priceCategory').value;const arr=prices.filter(x=>(!cat||x.category===cat)&&(!q||(x.name+' '+(x.category||'')+' '+(x.note||'')).toLowerCase().includes(q)));const groups={};arr.forEach(x=>(groups[x.category]??=[]).push(x));$('procedurePriceList').innerHTML=Object.keys(groups).sort().map(c=>`<div class="card pricegroup"><h3>${esc(c)}</h3>${groups[c].map(x=>`<div class="price-row"><div class="name"><b>${esc(x.name)}</b>${x.note?`<div class="muted">${esc(x.note)}</div>`:''}</div><div><span class="muted">רגיל:</span> <b>${range(x.regular_price_min,x.regular_price_max)}</b></div><div class="member">מנוי: ${memberRange(x)}</div><button class="btn" onclick="openPrice(${x.id})">עריכה</button></div>`).join('')}</div>`).join('')||'<p class="muted">אין תוצאות</p>'}function renderProductPrices(){$('productPriceList').innerHTML=products.map(x=>productCard(x,false)).join('')}function openPrice(id){const x=prices.find(y=>y.id===id);$('priceId').value=x?.id||'';$('priceName').value=x?.name||'';$('priceCat').value=x?.category||'';$('priceMin').value=x?.regular_price_min??'';$('priceMax').value=x?.regular_price_max??'';$('priceDiscount').value=x?.discount_percent??20;$('priceNote').value=x?.note||'';$('priceDelete').classList.toggle('hidden',!x);$('priceForm').classList.remove('hidden');$('priceForm').scrollIntoView({behavior:'smooth'})}function closePrice(){$('priceForm').classList.add('hidden')}async function savePrice(){const id=$('priceId').value,item={name:$('priceName').value.trim(),category:$('priceCat').value.trim()||'שונות',regular_price_min:$('priceMin').value,regular_price_max:$('priceMax').value,discount_percent:$('priceDiscount').value||20,note:$('priceNote').value};if(!item.name||!item.regular_price_min)return alert('צריך שם ומחיר');await api({action:id?'price_update':'price_create',id,item});closePrice();await loadAll()}async function deletePrice(){const id=$('priceId').value;if(id&&confirm('למחוק את השורה מהמחירון?')){await api({action:'price_delete',id});closePrice();await loadAll()}}$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});document.addEventListener('click',e=>{if(!e.target.closest('.global'))$('globalResults').classList.add('hidden')});if(sessionStorage.getItem('clinic')==='1'){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadAll()}
</script></body></html>
