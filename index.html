<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מערכת המרפאה</title>
<style>
:root{--blue:#4e86bd;--blue2:#69b8e6;--blue-soft:#eef8fd;--blue-pale:#f7fbfe;--ink:#17324b;--muted:#74879a;--line:#dcebf5;--white:#fff;--green:#248966;--red:#b83b4c;--gold:#b98717;--shadow:0 10px 28px rgba(44,93,130,.08)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#fff 0,#f4fbff 360px,#f8fbfd 100%);color:var(--ink)}button,input,select,textarea{font:inherit}.wrap{max-width:1240px;margin:auto;padding:18px 18px 42px}.hidden{display:none!important}.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.login{max-width:430px;margin:12vh auto;padding:28px;text-align:center}.login:before{content:'🐾';display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:var(--blue-soft);margin:0 auto 12px;font-size:30px}.login h1{margin:5px 0;font-size:28px}.login .primary{width:100%;margin-top:8px}
.top,.row,.sectionbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sectionbar{justify-content:space-between}.top{justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px 18px;box-shadow:var(--shadow);position:sticky;top:10px;z-index:15}.brand{font-size:26px;font-weight:850;letter-spacing:-.3px;color:#245f95}.brand:after{content:' · צוות המרפאה';font-size:13px;font-weight:600;color:#8aa3b8;margin-right:5px}
.btn{border:1px solid #d8e8f2;border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:700;background:#f7fbfe;color:#315b7d;transition:.18s ease}.btn:hover{transform:translateY(-1px);background:#eef7fc}.primary,.active{background:linear-gradient(135deg,var(--blue),var(--blue2))!important;color:#fff!important;border-color:transparent!important;box-shadow:0 7px 16px rgba(78,134,189,.18)}.danger{background:#fff1f3;color:#a52d40;border-color:#ffd8df}.settings-on{background:#244f72!important;color:#fff!important}
.settings-note{background:#edf8ff;border:1px solid #cbe9fa;padding:11px 14px;border-radius:14px;font-size:12px;margin:12px 0;color:#356987}.global{position:relative;margin:16px 0 12px}.search,.catfilter,.form input,.form select,.form textarea{padding:12px 14px;border:1px solid #d8e8f2;border-radius:14px;background:#fff;color:var(--ink);outline:none;transition:.18s}.search:focus,.catfilter:focus,.form input:focus,.form textarea:focus{border-color:#8bc8eb;box-shadow:0 0 0 4px #eaf7fe}.search{width:100%}.global .search{height:48px;padding-right:18px;box-shadow:0 6px 18px rgba(56,104,142,.06)}.catfilter{min-width:180px}.global-results{position:absolute;z-index:30;top:calc(100% + 6px);right:0;left:0;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(30,75,110,.16);max-height:380px;overflow:auto}.result{padding:12px 14px;border-bottom:1px solid #edf4f8;cursor:pointer}.result:hover{background:#f2f9fd}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px;background:#edf7fd;border:1px solid #dbeef9;padding:7px;border-radius:16px;width:max-content;max-width:100%}.tab,.subtab{border:0;border-radius:11px;padding:10px 17px;background:transparent;font-weight:750;color:#527087;cursor:pointer;transition:.18s}.tab:hover,.subtab:hover{background:#fff}.panel{animation:fade .18s ease}@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
.sectionbar{margin:14px 2px 12px}.sectionbar h2{margin:0;font-size:25px;color:#234f74}.sectionbar h2:after{content:'';display:block;width:38px;height:4px;border-radius:4px;background:var(--blue2);margin-top:6px}
.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start;margin-top:14px}.product{overflow:hidden;min-width:0;transition:.18s ease;background:#fff}.product:hover{transform:translateY(-2px);box-shadow:0 13px 30px rgba(50,103,142,.12);border-color:#cbe4f3}.pic{height:98px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff,#f6fbfe);border-bottom:1px solid #edf4f8;overflow:hidden;font-size:26px}.pic img{display:block;max-width:100%;max-height:100%;object-fit:contain}.product-info{padding:10px 11px 11px}.product h3{font-size:13px;line-height:1.35;margin:0 0 5px;overflow-wrap:anywhere;color:#24445e}.product .cat{font-size:10px;color:#8ca0b1}.price{font-weight:850;color:#367db7;font-size:14px;margin:6px 0}.missing-price{display:inline-block;background:#fff3f4;color:#b31d2c;border:1px solid #ffd5da;border-radius:9px;padding:5px 7px;font-size:10px;font-weight:900;margin:5px 0}.stockbox{border-top:1px solid #edf4f8;margin-top:8px;padding-top:8px}.stockline{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px}.target{color:#9ba8b4;font-weight:700}.qtycontrol{display:flex;align-items:center;gap:5px;background:#f4f9fc;padding:3px;border-radius:10px}.qtybtn{width:27px;height:27px;border:0;border-radius:8px;background:#e4f2fb;color:#3674a4;font-weight:900;cursor:pointer}.qtybtn:hover{background:#d4ebf8}.qtynum{min-width:22px;text-align:center;font-size:15px;font-weight:900}.low{color:var(--red)}.ok{color:var(--green)}.editbtn{margin-top:8px;width:100%;font-size:10px;padding:7px}
.form{padding:18px;margin:12px 0}.form h3{margin-top:0;color:#2a5b82}.form input,.form select,.form textarea{width:100%;margin:5px 0}.form textarea{min-height:80px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#procedureTools{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:12px;border-radius:18px;margin-bottom:12px}.pricegroup{padding:0;margin:14px 0;overflow:hidden}.pricegroup h3{margin:0;padding:14px 16px;background:linear-gradient(90deg,#eaf7fe,#f7fcff);font-size:16px;color:#2b628d;border-bottom:1px solid #dcecf6}.price-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:center;padding:11px 16px;border-top:1px solid #edf3f7;background:#fff}.price-row:first-of-type{border-top:0}.price-row:hover{background:#fbfdff}.price-row .name b{font-size:13px}.price-row .muted{font-size:11px;margin-top:3px}.member{color:var(--gold);font-weight:850}.subtab.active{background:#fff!important;color:#2e6f9f!important;box-shadow:0 4px 12px rgba(58,105,140,.10)!important}.pricegroup .btn{padding:7px 10px;font-size:11px}
#protocols .card{padding:24px!important;background:linear-gradient(135deg,#fff,#f1faff)}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.price-row{grid-template-columns:1fr 1fr}.price-row .name{grid-column:1/-1}.top{position:static}}
@media(max-width:650px){.wrap{padding:9px}.top{padding:11px 12px;border-radius:16px}.brand{font-size:20px}.brand:after{display:none}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.pic{height:78px}.product-info{padding:7px}.product h3{font-size:11px}.price{font-size:11px}.stockline{font-size:9px}.qtybtn{width:23px;height:23px}.qtynum{font-size:13px}.form-grid{grid-template-columns:1fr}.price-row{grid-template-columns:1fr 1fr;padding:10px 11px}.tabs{width:100%;justify-content:center}.tab,.subtab{padding:9px 11px;font-size:12px}.sectionbar h2{font-size:21px}.catfilter{min-width:135px}}
</style></head>
<body><div class="wrap">
<section id="login" class="card login"><h1>מערכת המרפאה</h1><p class="muted">גישה לצוות בלבד</p><input id="pin" class="search" type="password" inputmode="numeric" maxlength="4" placeholder="קוד כניסה"><div id="loginErr" style="color:#bd2434;min-height:24px"></div><button class="btn primary" onclick="login()">כניסה</button></section>
<section id="app" class="hidden">
<div class="top"><div class="brand">🐾 מערכת המרפאה</div><div class="row"><button id="settingsBtn" class="btn" onclick="toggleSettings()">⚙️ הגדרות עריכה</button><button class="btn" onclick="logout()">יציאה</button></div></div>
<div id="settingsNote" class="settings-note hidden">מצב עריכה פעיל — כאן אפשר לשנות כמות רצויה, פרטים, מחירים, תמונות ולמחוק/להוסיף מוצרים.</div>
<div class="global"><input id="globalSearch" class="search" placeholder="🔎 חיפוש בכל האתר..." oninput="renderGlobal()"><div id="globalResults" class="global-results hidden"></div></div>
<div class="tabs"><button class="tab active" data-tab="inventory" onclick="showTab('inventory',this)">מלאי</button><button class="tab" data-tab="protocols" onclick="showTab('protocols',this)">פרוטוקולים</button><button class="tab" data-tab="prices" onclick="showTab('prices',this)">מחירון</button></div>
<section id="inventory" class="panel"><div class="sectionbar"><h2>מלאי</h2><button id="newProductBtn" class="btn primary hidden" onclick="openProduct()">+ מוצר חדש</button></div><div class="row"><input id="inventorySearch" class="search" style="flex:1" placeholder="חיפוש במלאי..." oninput="renderInventory()"><select id="inventoryCategory" class="catfilter" onchange="renderInventory()"><option value="">כל הקטגוריות</option></select></div>
<div id="productForm" class="card form hidden"><h3>עריכת מוצר</h3><input id="prodId" type="hidden"><div class="form-grid"><input id="prodName" placeholder="שם מוצר"><input id="prodCat" placeholder="קטגוריה"><input id="prodPrice" type="number" step="0.01" placeholder="מחיר — להשאיר ריק אם לא ידוע"><input id="prodTarget" type="number" min="0" placeholder="כמה אמור להיות במלאי"><input id="prodCurrent" type="number" min="0" placeholder="כמה יש בפועל"><input id="prodImage" type="file" accept="image/*" onchange="readProductImage(event)"></div><textarea id="prodDetails" placeholder="הערות"></textarea><div class="row"><button class="btn primary" onclick="saveProduct()">שמור</button><button class="btn" onclick="closeProduct()">ביטול</button><button id="prodDelete" class="btn danger" onclick="deleteProduct()">מחיקה</button></div></div><div id="inventoryGrid" class="grid"></div></section>
<section id="protocols" class="panel hidden"><div class="card"><h2>פרוטוקולים</h2><p class="muted">כאן נכניס בהמשך את פרוטוקולי המרפאה.</p></div></section>
<section id="prices" class="panel hidden"><div class="sectionbar"><h2>מחירון</h2></div><div class="tabs"><button class="subtab active" id="procBtn" onclick="showPriceMode('procedures')">פרוצדורות</button><button class="subtab" id="productsBtn" onclick="showPriceMode('products')">מוצרים</button></div><div id="procedureTools" class="row"><input id="priceSearch" class="search" style="flex:1" placeholder="חיפוש בפרוצדורות..." oninput="renderPrices()"><select id="priceCategory" class="catfilter" onchange="renderPrices()"><option value="">כל הקטגוריות</option></select><button id="newPriceBtn" class="btn primary hidden" onclick="openPrice()">+ פרוצדורה חדשה</button></div><div id="priceForm" class="card form hidden"><h3>עריכת מחירון</h3><input id="priceId" type="hidden"><input id="priceName" placeholder="שם"><input id="priceCat" placeholder="קטגוריה"><input id="priceMin" type="number" step="0.01" placeholder="מחיר רגיל / מינימום"><input id="priceMax" type="number" step="0.01" placeholder="מחיר מקסימום"><input id="priceDiscount" type="number" value="20" placeholder="אחוז הנחת מנוי זהב"><textarea id="priceNote" placeholder="הערה"></textarea><div class="row"><button class="btn primary" onclick="savePrice()">שמור</button><button class="btn" onclick="closePrice()">ביטול</button><button id="priceDelete" class="btn danger" onclick="deletePrice()">מחיקה</button></div></div><div id="procedurePriceList"></div><div id="productPriceList" class="grid hidden"></div></section>
</section></div>
<script>
const API='https://bhvkhxmexyhsjhwjsytp.supabase.co/functions/v1/clinic-api',PIN='1016';let products=[],prices=[],productImageData='',priceMode='procedures',settingsMode=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(body){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-clinic-pin':PIN},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||'שגיאה');return j}
function login(){if($('pin').value!==PIN){$('loginErr').textContent='קוד לא נכון';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');sessionStorage.setItem('clinic','1');loadAll()}function logout(){sessionStorage.removeItem('clinic');location.reload()}
function toggleSettings(){settingsMode=!settingsMode;$('settingsBtn').classList.toggle('settings-on',settingsMode);$('settingsBtn').textContent=settingsMode?'✅ יציאה מהגדרות':'⚙️ הגדרות עריכה';$('settingsNote').classList.toggle('hidden',!settingsMode);$('newProductBtn').classList.toggle('hidden',!settingsMode);$('newPriceBtn').classList.toggle('hidden',!settingsMode);if(!settingsMode){closeProduct();closePrice()}renderInventory();renderPrices();renderProductPrices()}
async function loadAll(){try{const[a,b]=await Promise.all([api({action:'list'}),api({action:'price_list'})]);products=a.items||[];prices=b.items||[];fillFilters();renderInventory();renderPrices();renderProductPrices()}catch(e){alert('שגיאה בטעינת הנתונים: '+e.message)}}
function fillFilters(){const a=[...new Set(products.map(x=>x.category).filter(Boolean))].sort(),b=[...new Set(prices.map(x=>x.category).filter(Boolean))].sort();$('inventoryCategory').innerHTML='<option value="">כל הקטגוריות</option>'+a.map(c=>`<option>${esc(c)}</option>`).join('');$('priceCategory').innerHTML='<option value="">כל הקטגוריות</option>'+b.map(c=>`<option>${esc(c)}</option>`).join('')}
function showTab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');$('globalResults').classList.add('hidden')}
function renderGlobal(){const q=$('globalSearch').value.trim().toLowerCase(),box=$('globalResults');if(!q){box.classList.add('hidden');return}let out=[];products.filter(x=>(x.name+' '+(x.category||'')+' '+(x.details||'')).toLowerCase().includes(q)).slice(0,10).forEach(x=>out.push(`<div class="result" onclick="jumpProduct(${x.id})"><b>מוצר:</b> ${esc(x.name)}</div>`));prices.filter(x=>(x.name+' '+(x.category||'')+' '+(x.note||'')).toLowerCase().includes(q)).slice(0,10).forEach(x=>out.push(`<div class="result" onclick="jumpPrice(${x.id})"><b>מחירון:</b> ${esc(x.name)}</div>`));box.innerHTML=out.length?out.join(''):'<div class="result muted">לא נמצאו תוצאות</div>';box.classList.remove('hidden')}
function jumpProduct(id){showTab('inventory',document.querySelector('[data-tab="inventory"]'));$('inventorySearch').value=products.find(x=>x.id===id)?.name||'';renderInventory();$('globalSearch').value='';$('globalResults').classList.add('hidden')}function jumpPrice(id){showTab('prices',document.querySelector('[data-tab="prices"]'));showPriceMode('procedures');$('priceSearch').value=prices.find(x=>x.id===id)?.name||'';renderPrices();$('globalSearch').value='';$('globalResults').classList.add('hidden')}
function productCard(x,editable){const cur=Number(x.current_qty||0),tar=Number(x.target_qty||0),status=tar>0&&cur<tar?'low':'ok';const price=x.price_ils==null?'<div class="missing-price">⚠️ אין מחיר — צריך לתקן</div>':`<div class="price">${Number(x.price_ils).toLocaleString('he-IL')} ₪</div>`;return `<article class="card product"><div class="pic">${x.image_url?`<img src="${x.image_url}" alt="${esc(x.name)}">`:'📦'}</div><div class="product-info"><h3>${esc(x.name)}</h3><div class="muted cat">${esc(x.category||'')}</div>${price}<div class="stockbox"><div class="stockline"><span class="target">אמור להיות: ${tar}</span><div class="qtycontrol"><button class="qtybtn" onclick="adjustQty(${x.id},-1)" aria-label="הורד">−</button><span class="qtynum ${status}">${cur}</span><button class="qtybtn" onclick="adjustQty(${x.id},1)" aria-label="הוסף">+</button></div></div></div>${editable?`<button class="btn editbtn" onclick="openProduct(${x.id})">עריכת מוצר</button>`:''}</div></article>`}
function renderInventory(){const q=$('inventorySearch').value.trim().toLowerCase(),cat=$('inventoryCategory').value,arr=products.filter(x=>(!cat||x.category===cat)&&(!q||(x.name+' '+(x.category||'')+' '+(x.details||'')).toLowerCase().includes(q)));$('inventoryGrid').innerHTML=arr.map(x=>productCard(x,settingsMode)).join('')||'<p class="muted">אין תוצאות</p>'}
async function adjustQty(id,delta){try{const j=await api({action:'qty_adjust',id,delta});const i=products.findIndex(x=>x.id===id);if(i>=0)products[i]=j.item;renderInventory();if(priceMode==='products')renderProductPrices()}catch(e){alert('לא הצלחתי לעדכן כמות: '+e.message)}}
function openProduct(id){if(!settingsMode)return;const x=products.find(y=>y.id===id);$('prodId').value=x?.id||'';$('prodName').value=x?.name||'';$('prodCat').value=x?.category||'';$('prodPrice').value=x?.price_ils??'';$('prodTarget').value=x?.target_qty??0;$('prodCurrent').value=x?.current_qty??0;$('prodDetails').value=x?.details||'';productImageData=x?.image_url||'';$('prodDelete').classList.toggle('hidden',!x);$('productForm').classList.remove('hidden');$('productForm').scrollIntoView({behavior:'smooth'})}function closeProduct(){$('productForm').classList.add('hidden')}
function readProductImage(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>productImageData=String(r.result);r.readAsDataURL(f)}
async function saveProduct(){const id=$('prodId').value,item={name:$('prodName').value.trim(),category:$('prodCat').value.trim()||'אחר',price_ils:$('prodPrice').value,details:$('prodDetails').value,image_url:productImageData||null,target_qty:$('prodTarget').value,current_qty:$('prodCurrent').value};if(!item.name)return alert('צריך שם מוצר');await api({action:id?'update':'create',id,item});closeProduct();await loadAll()}async function deleteProduct(){const id=$('prodId').value;if(id&&confirm('למחוק את המוצר?')){await api({action:'delete',id});closeProduct();await loadAll()}}
function showPriceMode(mode){priceMode=mode;$('procBtn').classList.toggle('active',mode==='procedures');$('productsBtn').classList.toggle('active',mode==='products');$('procedureTools').classList.toggle('hidden',mode!=='procedures');$('procedurePriceList').classList.toggle('hidden',mode!=='procedures');$('productPriceList').classList.toggle('hidden',mode!=='products');$('priceForm').classList.add('hidden');if(mode==='products')renderProductPrices()}
function money(v){return Number(v).toLocaleString('he-IL',{maximumFractionDigits:2})+' ₪'}
function memberMoney(v){return Math.ceil(Number(v)).toLocaleString('he-IL')+' ₪'}
function range(a,b){return b!=null&&Number(b)!==Number(a)?money(a)+'–'+money(b):money(a)}
function regularRange(x){if(Number(x.regular_price_min)===0)return 'לפי הערה';return range(x.regular_price_min,x.regular_price_max)}
function memberRange(x){if(Number(x.regular_price_min)===0)return '—';const d=(100-Number(x.discount_percent??20))/100;return x.regular_price_max!=null&&Number(x.regular_price_max)!==Number(x.regular_price_min)?memberMoney(Number(x.regular_price_min)*d)+'–'+memberMoney(Number(x.regular_price_max)*d):memberMoney(Number(x.regular_price_min)*d)}
function renderPrices(){const q=$('priceSearch').value.trim().toLowerCase(),cat=$('priceCategory').value,arr=prices.filter(x=>(!cat||x.category===cat)&&(!q||(x.name+' '+(x.category||'')+' '+(x.note||'')).toLowerCase().includes(q))),groups={};arr.forEach(x=>(groups[x.category]??=[]).push(x));$('procedurePriceList').innerHTML=Object.keys(groups).sort().map(c=>`<div class="card pricegroup"><h3>${esc(c)}</h3>${groups[c].map(x=>`<div class="price-row"><div class="name"><b>${esc(x.name)}</b>${x.note?`<div class="muted">${esc(x.note)}</div>`:''}</div><div><span class="muted">רגיל:</span> <b>${regularRange(x)}</b></div><div class="member">מנוי זהב: ${memberRange(x)}</div>${settingsMode?`<button class="btn" onclick="openPrice(${x.id})">עריכה</button>`:''}</div>`).join('')}</div>`).join('')||'<p class="muted">אין תוצאות</p>'}
function renderProductPrices(){$('productPriceList').innerHTML=products.map(x=>productCard(x,settingsMode)).join('')}
function openPrice(id){if(!settingsMode)return;const x=prices.find(y=>y.id===id);$('priceId').value=x?.id||'';$('priceName').value=x?.name||'';$('priceCat').value=x?.category||'';$('priceMin').value=x?.regular_price_min??'';$('priceMax').value=x?.regular_price_max??'';$('priceDiscount').value=x?.discount_percent??20;$('priceNote').value=x?.note||'';$('priceDelete').classList.toggle('hidden',!x);$('priceForm').classList.remove('hidden');$('priceForm').scrollIntoView({behavior:'smooth'})}function closePrice(){$('priceForm').classList.add('hidden')}
async function savePrice(){const id=$('priceId').value,item={name:$('priceName').value.trim(),category:$('priceCat').value.trim()||'שונות',regular_price_min:$('priceMin').value,regular_price_max:$('priceMax').value,discount_percent:$('priceDiscount').value||20,note:$('priceNote').value};if(!item.name||$('priceMin').value==='')return alert('צריך שם ומחיר');await api({action:id?'price_update':'price_create',id,item});closePrice();await loadAll()}async function deletePrice(){const id=$('priceId').value;if(id&&confirm('למחוק את השורה מהמחירון?')){await api({action:'price_delete',id});closePrice();await loadAll()}}
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});document.addEventListener('click',e=>{if(!e.target.closest('.global'))$('globalResults').classList.add('hidden')});if(sessionStorage.getItem('clinic')==='1'){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadAll()}
</script></body></html>
