<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>כניסה מאובטחת | מערכת המרפאה</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fa;color:#22364a;font-family:Arial,sans-serif;padding:18px}.card{width:min(430px,100%);background:#fff;border:1px solid #dbe3e9;border-radius:16px;box-shadow:0 14px 42px rgba(28,55,82,.09);padding:28px}.mark{width:52px;height:52px;border-radius:13px;background:#edf3f8;display:grid;place-items:center;font-size:26px;margin-bottom:14px}h1{margin:0 0 6px;color:#173a5f;font-size:28px}.muted{color:#75899d;margin:0 0 22px}.field{margin:12px 0}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #d7e1e9;border-radius:9px;font:inherit;outline:none}input:focus{border-color:#82a9c8;box-shadow:0 0 0 3px rgba(74,123,161,.1)}button{width:100%;border:0;border-radius:9px;padding:12px;background:#2f6fa8;color:#fff;font:inherit;font-weight:800;cursor:pointer;margin-top:10px}button:disabled{opacity:.6;cursor:wait}.error{color:#b52d3b;min-height:22px;font-size:13px;margin-top:10px}.note{margin-top:18px;padding-top:14px;border-top:1px solid #edf2f5;font-size:12px;color:#7a8b9c;line-height:1.55}
</style>
</head>
<body>
<main class="card">
<div class="mark">🐾</div>
<h1>כניסה למערכת המרפאה</h1>
<p class="muted">כניסה אישית לצוות</p>
<form id="loginForm">
<div class="field"><label for="username">שם משתמש</label><input id="username" autocomplete="username" maxlength="40" required></div>
<div class="field"><label for="password">סיסמה</label><input id="password" type="password" autocomplete="current-password" maxlength="128" required></div>
<div id="error" class="error"></div>
<button id="submit" type="submit">כניסה</button>
</form>
<div class="note">הכניסה נשמרת למכשיר הזה לזמן מוגבל בלבד. אין לשמור את הסיסמה במחשב שאינו שייך למרפאה.</div>
</main>
<script>
const AUTH='https://bhvkhxmexyhsjhwjsytp.supabase.co/functions/v1/clinic-auth';
const TOKEN_KEY='clinic_session_token',EXP_KEY='clinic_session_expires';
const $=id=>document.getElementById(id);
async function call(body,withAuth=false){const headers={'content-type':'application/json'};if(withAuth)headers.authorization='Bearer '+(localStorage.getItem(TOKEN_KEY)||'');const r=await fetch(AUTH,{method:'POST',headers,body:JSON.stringify(body),cache:'no-store'});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||'שגיאה');return j}
async function alreadyIn(){const token=localStorage.getItem(TOKEN_KEY),exp=localStorage.getItem(EXP_KEY);if(!token||!exp||new Date(exp)<=new Date())return;try{await call({action:'validate'},true);location.replace('/')}catch{localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(EXP_KEY)}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('error').textContent='';const btn=$('submit');btn.disabled=true;btn.textContent='מתחברת...';try{const j=await call({action:'login',username:$('username').value.trim().toLowerCase(),password:$('password').value},false);localStorage.setItem(TOKEN_KEY,j.token);localStorage.setItem(EXP_KEY,j.expires_at);location.replace('/')}catch(err){$('error').textContent=err.message==='too many attempts'?'יותר מדי ניסיונות. נסי שוב בעוד כמה דקות.':'שם המשתמש או הסיסמה אינם נכונים'}finally{btn.disabled=false;btn.textContent='כניסה'}});
alreadyIn();
</script>
</body>
</html>
